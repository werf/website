<span class="breadcrumbs_versions">{% if page.lang == "ru" %}Версия{% else %}Version{% endif %}: </span>
{%- raw %}
{{ $CurrentPageURLRelative := .CurrentPageURLRelative }}
<a data-proofer-ignore href="#">
    {{ .CurrentVersion }}</a>
<div class="submenu-container">
    <ul class="submenu">
        {{- range .VersionItems }}
        {{- if not .IsCurrent }}
        <li class="submenu-item">
            <a data-proofer-ignore class="submenu-item-link"
                href="/docs/{{ .VersionURL }}{{ $CurrentPageURLRelative }}">
                <span class="submenu-item-channel">{{ .Version }}</span>
            </a>
        </li>
        {{- end }}
        {{- end }}
    </ul>
</div>
{% endraw %}
