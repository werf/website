{{- $host := pluck .Values.werf.env .Values.host | first | default .Values.host._default  }}
{{- if  hasPrefix "review" .Values.werf.env }}
{{- $host = ( printf "%s.%s" .Values.werf.env (pluck "dev" .Values.host | first | default .Values.host._default ) | lower ) }}
{{- end }}
{{- $targetCluster := include "targetCluster" . }}
{{- $ruHost := pluck .Values.werf.env .Values.ruHost | first | default (printf "ru.%s" $host) }}
{{- $wwwHost := printf "www.%s" $host }}
{{- $ingressSecretName := pluck .Values.werf.env .Values.ingressSecretName | first | default .Values.ingressSecretName._default }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tuf-router
{{- if eq .Values.werf.env "production" }}
  annotations:
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
{{- else }}
  annotations: {}
{{- end }}
spec:
  ingressClassName: {{ include "ingressClassName" . }}
  tls:
  - hosts:
      - {{ $host }}
{{- if eq .Values.werf.env "production" }}
      - {{ $wwwHost }}
{{- if eq $targetCluster "ru" }}
      - {{ $ruHost }}
{{- end }}
    secretName: {{ $ingressSecretName }}
{{- else }}
      - ru-{{ $host }}
    secretName: {{ $ingressSecretName }}
{{- end }}
  rules:
  - host: {{ $host }}
    http:
      paths:
      - path: /targets/
        pathType: Prefix
        backend:
          service:
            name: tuf-router
            port:
              name: http
      - path: /download/
        pathType: Prefix
        backend:
          service:
            name: tuf-router
            port:
              name: http
{{- if eq .Values.werf.env "production" }}
{{- if eq $targetCluster "ru" }}
  - host: {{ $ruHost }}
    http:
      paths:
      - path: /targets/
        pathType: Prefix
        backend:
          service:
            name: tuf-router
            port:
              name: http
      - path: /download/
        pathType: Prefix
        backend:
          service:
            name: tuf-router
            port:
              name: http
{{- end }}
{{- else }}
  - host: ru-{{ $host }}
    http:
      paths:
      - path: /targets/
        pathType: Prefix
        backend:
          service:
            name: tuf-router
            port:
              name: http
      - path: /download/
        pathType: Prefix
        backend:
          service:
            name: tuf-router
            port:
              name: http
{{- end }}
