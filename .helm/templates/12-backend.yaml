apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    "werf.io/replicas-on-creation": "1"
  labels:
    service: backend
spec:
  minReadySeconds: 5
  revisionHistoryLimit: 5
  {{- if eq .Values.werf.env "production" }}
  replicas: 5
  {{- end }}
  selector:
    matchLabels:
      service: backend
  template:
    metadata:
      labels:
        service: backend
    spec:
{{- include "imagePullSecrets" . | indent 6 }}
      priorityClassName: {{ pluck .Values.werf.env .Values.priorityClassName | first | default .Values.priorityClassName._default }}
{{- with .Values.backend.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- include "clusterPlacement" . | indent 6 }}
      containers:
        - name: backend
          command: ["/app/server"]
          image: {{ index .Values.werf.image "web-backend" }}
{{- include "resources" . | indent 10 }}
          ports:
          - containerPort: 8080
            name: http
            protocol: TCP
          env:
          - name: CURRENT_DOCS_MAJOR
            value: {{ include "docsCurrentMajor" . | quote }}
          - name: SUPPORTED_DOCS_MAJOR_VERSIONS
            value: {{ include "docsSupportedRootsCSV" . | quote }}
          - name: DOCS_LATEST_ALIAS_ENABLED
            value: {{ include "docsLatestAliasEnabled" . | quote }}
          - name: LOG_LEVEL
            value: "info"
{{- if ne .Values.werf.env "production" }}
          - name: URL_VALIDATION
            value: "false"
{{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  clusterIP: None
  selector:
    service: backend
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
---
apiVersion: autoscaling.k8s.io/v1beta2
kind: VerticalPodAutoscaler
metadata:
  name: backend
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: backend
  updatePolicy:
    updateMode: "Initial"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      service: backend
