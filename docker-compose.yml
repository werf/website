version: "3.9"

x-docs-routing-env: &docs-routing-env
  CURRENT_DOCS_MAJOR: ${CURRENT_DOCS_MAJOR:-}
  SUPPORTED_DOCS_MAJOR_VERSIONS: ${SUPPORTED_DOCS_MAJOR_VERSIONS:-v2,v1}
  DOCS_LATEST_ALIAS_ENABLED: ${DOCS_LATEST_ALIAS_ENABLED:-}

services:
  en:
    image: $WERF_JEKYLL_BASE_DOCKER_IMAGE_NAME
    working_dir: "/app"
    environment:
      JEKYLL_ENV: "dev"
    command:
      - bash
      - -ec
      - |
        for path in /app/*; do
          name=$$(basename "$$path")
          case "$$name" in
            .git|ai-test|ai-work) continue ;;
          esac
          chmod -R o+w "$$path"
        done
        chmod -R o+w /tmp/_site/
        jekyll serve -t --disable-disk-cache --config _config.yml,_config_dev.yml,_config_en.yml --destination /tmp/_site -P 80 --profile --watch --trace
    volumes:
      - "./:/app/:cached"
      - "./_site_en_includes:/tmp/_site/includes"
    networks:
      default:
        aliases:
          - website-en

  ru:
    image: $WERF_JEKYLL_BASE_DOCKER_IMAGE_NAME
    working_dir: "/app"
    environment:
      JEKYLL_ENV: "dev"
    command:
      - bash
      - -ec
      - |
        for path in /app/*; do
          name=$$(basename "$$path")
          case "$$name" in
            .git|ai-test|ai-work) continue ;;
          esac
          chmod -R o+w "$$path"
        done
        chmod -R o+w /tmp/_site/
        jekyll serve -t --disable-disk-cache --config _config.yml,_config_dev.yml,_config_ru.yml --destination /tmp/_site -P 80 --profile --watch --trace
    volumes:
      - "./:/app/:cached"
      - "./_site_ru_includes:/tmp/_site/includes"
    networks:
      default:
        aliases:
          - website-ru

  front:
    image: nginx:latest
    environment:
      <<: *docs-routing-env
    command:
      - /bin/sh
      - -ec
      - |
        /bin/sh /etc/nginx/render-docs-nginx.sh
        exec nginx -g "daemon off;"
    volumes:
      - ".werf/nginx-dev.conf:/etc/nginx/templates/nginx.conf.template:ro"
      - ".werf/render-docs-nginx.sh:/etc/nginx/render-docs-nginx.sh:ro"
    ports:
      - "80:80"
    depends_on:
      - ru
      - en

  backend:
    image: $WERF_BACKEND_DOCKER_IMAGE_NAME
    environment:
      <<: *docs-routing-env
      LOG_LEVEL: info
      URL_VALIDATION: "false"
    command: "/app/server"
    volumes:
      - "./_site_en_includes:/app/root/en/includes"
      - "./_site_ru_includes:/app/root/ru/includes"
    depends_on:
      - ru
      - en
      - front

networks:
  default:
    name: werfio-dev
    external: true
